--core:#4493f8;--cores:#1f6feb;--pw:#d29922;--dat:#4493f8;--ctl:#ab7df8;--ir:#f85149;--ok:#3fb950;--wip:#d29922;--todo:#6e7681;--metal:#8b949e}}
