# /etc/openhw/persond.conf — openhw-persond (사람 감지 → 이벤트)
# sscma-node 브로커 (이미지 기본 mosquitto 는 로컬 전용)
host = localhost
port = 1883
client = recamera
# 이벤트를 보낼 브로커·토픽. 기본은 같은 로컬 브로커. 수신 서버가 생기면 event_host 를 그 주소로
event_host = localhost
event_port = 1883
event_topic = openhw/v1/event
model = /usr/share/openhw/models/yolox_nano_person_416_int8_cv181x.cvimodel
# 카메라: 0=1080p 1=720p 2=640x480
cam_option = 1
cam_fps = 15
# 이벤트 판정
min_score = 0.5
enter_frames = 3
leave_ms = 5000
cooldown_ms = 30000
# RTSP (sscma-node stream 노드, rtsp://<user>:<pass>@<장치>:554/live). 비밀번호가 비면 켜지 않는다
rtsp = 1
rtsp_port = 554
rtsp_user = admin
rtsp_pass =
