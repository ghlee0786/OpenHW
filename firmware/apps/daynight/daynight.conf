# /etc/openhw/daynight.conf — openhw-daynight 와 sscma-node(isp_mirror_flip) 가 읽는다.
# 조도 소스: ltr329 (i2c-2 0x29, D-003 #18) | adc (차선 LIGHT_SENSE ADC1 — adc_path 필요, 드라이버 미확인)
als_source = ltr329
night_lux = 5
day_lux = 20
samples = 3
poll_ms = 1000
# ICR 펄스 폭 (100~500ms 로 강제)
icr_pulse_ms = 200
# 밤(필터 빼기) 방향: 1 = IN1 High / IN2 Low. CLA216 극성은 실물에서 확인 (계약 14절 실물 4)
icr_night_in1 = 1
# IR_PWM Low(켬) 비율. 0.25 를 넘게 써도 0.25 로 강제된다 (O-31)
ir_on_ratio = 0.25
# ≤500Hz 로 강제
pwm_freq_hz = 400
# 전면 DF30 180° 배치(P-003) → 영상 mirror+flip. 0 이면 끈다
isp_mirror_flip = 1
